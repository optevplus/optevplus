# OptEV+ themes: teal #0097B2 to green #7ED957 on light and dark. Streamlit reads this from the
# working directory, so the same file is at the repo root (Streamlit Cloud) and in SystemCode/.
[theme.light]
primaryColor = "#0097B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F8"
textColor = "#202020"
linkColor = "#0097B2"
borderColor = "#E2E8EB"

[theme.dark]
primaryColor = "#1FB5CC"
backgroundColor = "#0B1418"
secondaryBackgroundColor = "#13222A"
textColor = "#E6EEF0"
linkColor = "#3CC6DA"
borderColor = "#22343B"

[theme]
baseRadius = "medium"

[client]
toolbarMode = "viewer"
