[project]
name = "optev"
version = "0.1.0"
description = "OptEV+ — intelligent EV charging infrastructure planner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "neo4j>=5.24",
    "ortools>=9.11",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "streamlit>=1.39",
    "pydeck>=0.9",
    "python-dotenv>=1.0",
    "certifi>=2024.2",
    "pyproj>=3.6",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.11", "pytest-cov>=5.0"]

[project.scripts]
optev-db = "optev.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
