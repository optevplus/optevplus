# Rule register (SYSTEM_DESIGN.md §4.4, #17). Loaded by optev.reasoning.rules.load_register.
#
# One [[rules]] entry per rule: every field of the Rule contract plus on_fail.
#   source      gov_dataset | gov_policy | math_constraint | project_assumption
#   source_ref  a dataset, document or assumption id from the references the graph loads
#   on_fail     reject | conditional   (a missing required fact always defers, never rejects)
# Thresholds are not written here: rules read them from optev.assumptions.
# Templates are filled from the site's facts plus the values the rule computed.

[[rules]]
rule_id = "R01"
condition = "Car capacity is published for the site"
source = "gov_dataset"
source_ref = "ds-ura-capacity"
required_facts = ["total_lots"]
explanation_template = "Capacity is known: {total_lots} car lots."
on_fail = "reject"

[[rules]]
rule_id = "R02"
condition = "A basement car park needs a fire-safety review first"
source = "gov_policy"
source_ref = "doc-lta-ev-safety"
required_facts = ["car_park_type"]
explanation_template = "Car park type is {car_park_type}; basement sites need a fire-safety review."
on_fail = "conditional"

[[rules]]
rule_id = "R03"
condition = "Existing plus one new point stays within the share of car lots with charging capacity"
source = "math_constraint"
source_ref = "doc-lta-ev-factsheet-2021"
required_facts = ["total_lots", "existing_connectors"]
explanation_template = "Room for {room} more points within {share:.0%} of {total_lots} lots."
on_fail = "reject"

[[rules]]
rule_id = "R04"
condition = "Sites whose existing chargers are idle get no more points"
source = "project_assumption"
source_ref = "asm-idle-threshold"
required_facts = ["supply_state"]
explanation_template = "Supply state is {supply_state}; idle means used under {idle_below:.0%} of the time."
on_fail = "reject"

[[rules]]
rule_id = "R05"
condition = "The site lies inside a Master Plan 2025 planning area"
source = "gov_dataset"
source_ref = "ds-mp2025-areas"
required_facts = ["planning_area"]
explanation_template = "Planning area: {planning_area}."
on_fail = "reject"
