must_mention = ["0.7604"]

[[q]]
question = "Where does SYN-S-27's demand estimate come from, with no chargers there?"
type = "demand_basis"
params = { site_id = "SYN-S-27" }
must_cite = ["SYN-S-27@all"]
must_mention = ["supply"]

[[q]]
question = "Compare SYN-S-04 and SYN-S-13."
type = "compare_sites"
params = { site_a = "SYN-S-04", site_b = "SYN-S-13" }
