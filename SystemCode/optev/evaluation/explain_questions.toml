# Stage 5 answer key (SYSTEM_DESIGN.md §6): 20 planner questions on optev.sample, each
# answered from the source tables before any model was run.
#
#   type, params   what classify() must produce (absent type = out of scope, must refuse)
#   must_cite      evidence ids a correct answer rests on: retrieval must return them all
#   must_mention   facts the final answer must state (case-insensitive substrings)
#   refuse         true when the right answer is a refusal
#
# Written from optev/sample/data/entities.json. Regenerate if the sample changes.

[[q]]
question = "Why was SYN-S-13 rejected?"
type = "why_not_site"
params = { site_id = "SYN-S-13" }
must_cite = ["R03", "doc-lta-ev-factsheet-2021"]
must_mention = ["R03", "reject"]

[[q]]
question = "Why wasn't SYN-S-14 chosen?"
type = "why_not_site"
params = { site_id = "SYN-S-14" }
must_cite = ["R04", "asm-idle-threshold"]
must_mention = ["R04", "idle"]

[[q]]
question = "Why is SYN-S-06 only conditional?"
type = "why_not_site"
params = { site_id = "SYN-S-06" }
must_cite = ["R02", "doc-lta-ev-safety"]
must_mention = ["R02", "basement"]

[[q]]
question = "Why was SYN-S-27 deferred?"
type = "why_not_site"
params = { site_id = "SYN-S-27" }
must_cite = ["R01", "R03"]
must_mention = ["defer"]

[[q]]
question = "Why was SYN-S-04 accepted?"
type = "why_site"
params = { site_id = "SYN-S-04" }
must_cite = ["observed:SYN-S-04", "R01", "R03", "SYN-S-04@all"]
must_mention = ["accept"]

[[q]]
question = "Why does SYN-S-15 get new charging points?"
type = "why_site"
params = { site_id = "SYN-S-15" }
must_cite = ["observed:SYN-S-15", "base:all:points=12:budget=-"]
must_mention = ["2"]

[[q]]
question = "Where does the demand estimate for SYN-S-04 come from?"
